<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>论坛 - RatStudio的小站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:linear-gradient(135deg,#0f1419,#0a0c12);display:flex;align-items:center;justify-content:center;height:100vh}
.container{
  display:flex;width:680px;height:750px;border-radius:44px;overflow:hidden;
  background:rgba(255,255,255,.04);backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 50px rgba(60,120,255,0.25);
}
.sidebar{
  width:140px;background:rgba(255,255,255,.05);padding:30px 10px;
  display:flex;flex-direction:column;gap:10px;
  border-right:1px solid rgba(255,255,255,.08);
}
.item{
  padding:14px;border-radius:16px;color:rgba(255,255,255,.8);text-align:center;
  cursor:pointer;transition:all 0.2s;border:1px solid transparent;
}
.item:hover,.item.active{
  background:rgba(60,130,255,.25);color:#fff;
  border-color:rgba(100,160,255,0.4);
  box-shadow:0 0 12px rgba(80,140,255,0.35);
}
.main{flex:1;position:relative}
.top{
  background:rgba(255,255,255,.05);padding:20px;color:#fff;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.add{
  width:32px;height:32px;background:rgba(60,120,255,.3);border:none;border-radius:50%;
  color:#fff;font-size:18px;cursor:pointer;
  box-shadow:0 0 10px rgba(80,140,255,0.4);
}
/* 列表区 + 详情区 */
.page{display:none;height:630px;overflow-y:auto;padding:20px}
.page.active{display:block}
.post{
  background:rgba(255,255,255,.07);border-radius:18px;padding:16px;margin-bottom:12px;color:#fff;
  border:1px solid rgba(255,255,255,.12);cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,0.15);transition:all 0.2s;
}
.post:hover{
  border-color:rgba(100,160,255,0.3);
  box-shadow:0 0 15px rgba(80,140,255,0.25);
}
.post h3{margin-bottom:8px}
.post .info{color:#aaa;font-size:12px;margin-bottom:8px}
.post .content{margin-bottom:10px;line-height:1.5}
.like{
  background:rgba(255,80,80,.25);color:#fff;border:none;padding:6px 12px;border-radius:12px;
  cursor:pointer;box-shadow:0 0 8px rgba(255,80,80,0.3);
}
/* 帖子详情 */
.detail{padding:20px;color:#fff}
.detail h2{margin-bottom:12px}
.detail .info{color:#aaa;font-size:14px;margin-bottom:16px}
.detail .content{line-height:1.7;font-size:15px;margin-bottom:20px}
.back{
  background:#4080ff;color:#fff;border:none;padding:8px 14px;border-radius:12px;
  cursor:pointer;margin-bottom:16px;
}
.mask{
  position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;
  backdrop-filter:blur(4px);
}
.pop{
  background:#1a1c25;padding:30px;border-radius:24px;width:90%;max-width:400px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 30px rgba(60,120,255,0.3);
}
.pop input,.pop textarea{
  width:100%;margin-bottom:12px;background:#262833;border:none;border-radius:12px;
  padding:12px;color:#fff;
  border:1px solid rgba(255,255,255,.15);
}
.pop textarea{height:120px;resize:none}
.pop button{
  width:100%;padding:12px;background:#4080ff;border:none;border-radius:12px;color:#fff;
  box-shadow:0 0 12px rgba(80,140,255,0.4);
}
.version{position:absolute;right:18px;bottom:12px;color:#888;font-size:12px}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<div class="item" onclick="location.href='index.html'">聊天室</div>
<div class="item active" onclick="location.href='forum.html'">论坛</div>
<div class="item" onclick="location.href='history.html'">更新日志</div>
<div class="item" onclick="location.href='plan.html'">开发规划</div>
</div>
<div class="main">
<div class="top">
<span>论坛</span>
<button class="add" onclick="showPost()">+</button>
</div>

<!-- 帖子列表页 -->
<div class="page active" id="listPage">
  <div class="posts" id="list"></div>
</div>

<!-- 帖子详情页（子页面） -->
<div class="page" id="detailPage">
  <div class="detail">
    <button class="back" onclick="goBack()">← 返回列表</button>
    <h2 id="detailTitle"></h2>
    <div class="info" id="detailInfo"></div>
    <div class="content" id="detailContent"></div>
    <button class="like" id="detailLikeBtn" onclick="likeDetail()"></button>
  </div>
</div>

<div class="mask" id="mask">
<div class="pop">
<input id="title" placeholder="标题">
<textarea id="content" placeholder="内容"></textarea>
<button onclick="createPost()">发布帖子</button>
</div>
</div>
<div class="version">V1.2.4</div>
</div>
</div>

<script>
const user=localStorage.getItem('user')
const uid=localStorage.getItem('uid')
let postsData=[]; // 全局保存帖子数据
let currentPostId=null;

if(!user||!uid){
  alert('请先登录')
  location.href='index.html'
}

function showPost(){document.getElementById('mask').style.display='grid'}
function hidePost(){document.getElementById('mask').style.display='none'}

async function createPost(){
  try {
    const title=document.getElementById('title').value
    const content=document.getElementById('content').value
    if(!title||!content){
      alert('标题和内容不能为空')
      return
    }
    await fetch('/api/createPost',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid,user,title,content})
    })
    hidePost()
    loadPosts()
  }catch(e){
    alert('发帖失败')
    console.error(e)
  }
}

async function loadPosts(){
  try {
    const r=await fetch('/api/posts')
    const list=await r.json() // 修复：r.json()
    postsData=list;
    renderList()
    route() // 初始路由判断
  }catch(e){
    console.error('加载帖子失败',e)
  }
}

// 渲染列表
function renderList(){
  const box=document.getElementById('list')
  box.innerHTML=''
  postsData.forEach(p=>{
    const div=document.createElement('div')
    div.className='post'
    div.innerHTML=`
      <h3>${p.title}</h3>
      <div class="info">作者：${p.user} UID：${p.uid} · ${p.time||''}</div>
      <div class="content">${p.content.substring(0,80)}${p.content.length>80?'...':''}</div>
      <button class="like" onclick="event.stopPropagation();like(${p.postId})">点赞 ${p.like||0}</button>
    `
    div.onclick=()=>goDetail(p.postId)
    box.appendChild(div)
  })
}

// 进入详情（设置URL：forum.html#/1、forum.html#/2）
function goDetail(postId){
  history.pushState(null,null,`#/${postId}`)
  route()
}
// 返回列表
function goBack(){
  history.pushState(null,null,`#/`)
  route()
}

// 路由控制：显示列表/详情
function route(){
  const hash=location.hash.slice(1)||'/';
  const listPage=document.getElementById('listPage')
  const detailPage=document.getElementById('detailPage')
  
  if(hash==='/'){
    listPage.classList.add('active')
    detailPage.classList.remove('active')
  }else{
    const id=hash.replace('/','')
    const post=postsData.find(p=>p.postId==id)
    if(post){
      currentPostId=id
      listPage.classList.remove('active')
      detailPage.classList.add('active')
      document.getElementById('detailTitle').textContent=post.title
      document.getElementById('detailInfo').textContent=`作者：${post.user} | UID：${post.uid} | ${post.time||''}`
      document.getElementById('detailContent').textContent=post.content
      document.getElementById('detailLikeBtn').textContent=`点赞 ${post.like||0}`
    }else{
      goBack()
    }
  }
}

// 监听路由变化
window.addEventListener('hashchange',route)

async function like(postId){
  try {
    const r=await fetch('/api/like',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid,postId})
    })
    const t=await r.text()
    if(t=='repeat')alert('已经点赞过啦')
    loadPosts()
  }catch(e){
    alert('点赞失败')
    console.error(e)
  }
}

function likeDetail(){
  like(currentPostId)
}

loadPosts()
</script>
</body>
</html>
